# Hardening E1 - Rate limiting de endpoints de login
# ATDT IDOR 2026 - SCE / SCE_ASP / SCE_ENBC
#
# Archivo de referencia para incluir en Apache:
#   Include "/opt/sce_asp_scriptcase/seguridad/PAQUETE_ENVIO_ATDT_IDOR/99_Referencias/rate_limit_login_apache.conf"
#
# Nota:
# - mod_ratelimit limita ancho de banda por respuesta (throttling), no conteo por segundo.
# - Para control fuerte por IP/ventana, usar mod_evasive o WAF.

###############################################################################
# 1) Throttling por endpoint de login (mod_ratelimit)
###############################################################################
<IfModule ratelimit_module>
    # SCE
    <LocationMatch "^/sce/app_Login/">
        SetOutputFilter RATE_LIMIT
        # KB/s por respuesta (ajustar segun pruebas)
        SetEnv rate-limit 200
    </LocationMatch>

    # SCE_ASP (se observan variaciones de nombre en algunos despliegues)
    <LocationMatch "^/sce_asp/(app_Login|App_login)/">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 200
    </LocationMatch>

    # SCE_ENBC (nombre esperado de login generado por ScriptCase)
    <LocationMatch "^/sce_enbc/(app_enbc_Login|app_Login|App_login)/">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 200
    </LocationMatch>
</IfModule>

###############################################################################
# 2) Control por frecuencia de peticiones (mod_evasive) - recomendado
###############################################################################
# Requiere modulo instalado y cargado:
#   LoadModule evasive20_module modules/mod_evasive24.so
#
# Si no existe mod_evasive en el servidor, esta seccion se ignora.
<IfModule evasive20_module>
    DOSHashTableSize 2048
    DOSPageCount 8
    DOSSiteCount 60
    DOSPageInterval 60
    DOSSiteInterval 60
    DOSBlockingPeriod 600
    DOSLogDir "/opt/lampp/logs/mod_evasive"
</IfModule>

###############################################################################
# 3) Recomendaciones de validacion operativa
###############################################################################
# 1. Probar sintaxis:
#      /opt/lampp/bin/httpd -t
# 2. Recargar Apache:
#      /opt/lampp/lampp reloadapache
# 3. Verificar que no rompe login funcional:
#      /sce/app_Login/
#      /sce_asp/App_login/
#      /sce_enbc/...
# 4. Evidencia para Anexo H:
#    - captura de include activo en vhost
#    - captura de prueba de carga ligera con respuesta limitada
